name: Release v0513
on: push
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Add work titles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Composition Studio.lua'); s=p.read_text()
          s=s.replace('-- @version 0.5.12','-- @version 0.5.13',1).replace('local VERSION="0.5.12"','local VERSION="0.5.13"',1)
          s=s.replace('local WINDOW_STATE_KEY,HISTORY_KEY="WindowOpen","HistoryV1"','local WINDOW_STATE_KEY,HISTORY_KEY="WindowOpen","HistoryV1"\nlocal TITLE_KEY="LastWorkTitle"\nlocal work_title=reaper.GetProjExtState(0,EXT_SECTION,TITLE_KEY); if type(work_title)=="number" then local _,v=reaper.GetProjExtState(0,EXT_SECTION,TITLE_KEY); work_title=v end; work_title=trim and trim(work_title) or tostring(work_title or "")',1)
          # trim is defined later, so normalize safely without trim here
          s=s.replace('work_title=trim and trim(work_title) or tostring(work_title or "")','work_title=tostring(work_title or ""):gsub("^%s+",""):gsub("%s+$","")',1)
          # helper after trim
          marker='local function shell_quote(s)'
          pos=s.index(marker)
          helper='''local function safe_work_title(t)\n t=trim(t):gsub("[\\r\\n]"," "):gsub("[/\\\\:]","-"):gsub("%s+"," "):gsub("^%.*",""):gsub("%.*$","")\n if #t>80 then t=t:sub(1,80):gsub("%s+$","") end\n return t\nend\nlocal function title_from_draft(draft,request)\n local t=tostring(draft or ""):match("^[Tt][Ii][Tt][Ee][Ll]%s*:%s*([^\\n\\r]+)") or tostring(draft or ""):match("^[Ww][Ee][Rr][Kk][Tt][Ii][Tt][Ee][Ll]%s*:%s*([^\\n\\r]+)")\n t=safe_work_title(t or "")\n if t=="" then t=safe_work_title(request or "") end\n if t=="" then t="Neue Komposition" end\n return t\nend\n'''
          s=s[:pos]+helper+s[pos:]
          # Ask for a short title as part of musical draft, without constraining music.
          old='Schreibe einen vollständigen, konkret ausnotierbaren musikalischen Entwurf, aus dem anschließend eine andere technische Instanz die MIDI-Daten erzeugen kann. Mache keine Erläuterung über deine Arbeitsweise.'
          new='Schreibe einen vollständigen, konkret ausnotierbaren musikalischen Entwurf, aus dem anschließend eine andere technische Instanz die MIDI-Daten erzeugen kann. Gib in der ersten Zeile lediglich einen kurzen passenden Werktitel als „Titel: …“ an; dies soll die musikalische Gestaltung nicht einschränken. Mache keine Erläuterung über deine Arbeitsweise.'
          if old not in s: raise SystemExit('draft prompt marker missing')
          s=s.replace(old,new,1)
          # Capture title from completed musical draft.
          old='diag_set("musical_draft",text); data.draft=text; local tp=midi_translation_prompt(data.request,text);'
          new='diag_set("musical_draft",text); data.draft=text; work_title=title_from_draft(text,data.request); reaper.SetProjExtState(0,EXT_SECTION,TITLE_KEY,work_title); local tp=midi_translation_prompt(data.request,text);'
          if old not in s: raise SystemExit('musical draft stage marker missing')
          s=s.replace(old,new,1)
          # Use work title in save dialogs.
          s=s.replace('"Composition-Studio-Diagnose-"..os.date("%Y%m%d-%H%M%S")..".json"','safe_work_title(work_title~="" and work_title or "Composition Studio").." - Diagnose.json"',1)
          s=s.replace('"Composition-Studio-"..os.date("%Y%m%d-%H%M%S")..".mid"','safe_work_title(work_title~="" and work_title or "Neue Komposition")..".mid"',1)
          p.write_text(s)
          PY
      - name: Verify Lua and architecture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
          grep -q -- '-- @version 0.5.13' 'Composition Studio.lua'
          grep -q 'local VERSION="0.5.13"' 'Composition Studio.lua'
          grep -q 'Titel: …' 'Composition Studio.lua'
          grep -q 'title_from_draft' 'Composition Studio.lua'
          grep -q 'midi_translation_prompt' 'Composition Studio.lua'
          grep -q 'musical_draft' 'Composition Studio.lua'
          grep -q 'choose file name' 'Composition Studio.lua'
      - name: Publish
        run: |
          git config user.name 'wibem1'
          git config user.email 'wibem1@googlemail.com'
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.13 use musical work titles for exports'
          git push origin HEAD:composition-studio
