name: Build Composition Studio v0.5.9
on:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Patch
        run: |
          echo '' | base64 -d > /tmp/p.py
          python3 /tmp/p.py
      - name: Verify
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
          grep -F -- '-- @version 0.5.9' 'Composition Studio.lua'
          grep -F 'local VERSION="0.5.9"' 'Composition Studio.lua'
          grep -F 'local function midi_translation_prompt' 'Composition Studio.lua'
          grep -F 'LastDiagnosisV2' 'Composition Studio.lua'
      - name: Publish
        run: |
          git config user.name wibem1
          git config user.email wibem1@googlemail.com
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.9 repair save crash'
          git push origin HEAD:composition-studio
