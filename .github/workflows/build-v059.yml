name: Build Composition Studio v0.5.9
on:
  push:
    paths: ['.github/workflows/build-v059.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: composition-studio}
      - name: Repair unsupported REAPER save API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Composition Studio.lua'); s=p.read_text()
          s=s.replace('-- @version 0.5.8','-- @version 0.5.9',1).replace('local VERSION="0.5.8"','local VERSION="0.5.9"',1)
          old='''local function choose_save_path(title,default_name,ext)
 local ok,fn=reaper.GetUserFileNameForWrite("",title,ext)
 if not ok or not fn or fn=="" then return nil end
 if not fn:lower():match("%."..ext.."$") then fn=fn.."."..ext end
 return fn
end'''
          new='''local function choose_save_path(title,default_name,ext)
 -- REAPER has no native GetUserFileNameForWrite API. Never call a missing API.
 -- Use JS save panel when installed; otherwise ask for a filename and save visibly to REAPER resource path.
 if reaper.JS_Dialog_BrowseForSaveFile then
  local rv,fn=reaper.JS_Dialog_BrowseForSaveFile(title,reaper.GetResourcePath(),default_name,"* ."..ext)
  if rv and rv~=0 and fn and fn~="" then if not fn:lower():match("%."..ext.."$") then fn=fn.."."..ext end; return fn end
  return nil
 end
 local ok,name=reaper.GetUserInputs(title,1,"Dateiname:,extrawidth=260",default_name)
 if not ok then return nil end
 name=trim(name):gsub("[/\\\\:]","-")
 if name=="" then return nil end
 if not name:lower():match("%."..ext.."$") then name=name.."."..ext end
 return reaper.GetResourcePath().."/"..name
end'''
          if old not in s: raise SystemExit('choose_save_path anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Lua syntax and safety checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
          grep -F -- '-- @version 0.5.9' 'Composition Studio.lua'
          grep -F 'local VERSION="0.5.9"' 'Composition Studio.lua'
          ! grep -q 'reaper.GetUserFileNameForWrite' 'Composition Studio.lua'
          grep -F 'local function midi_translation_prompt' 'Composition Studio.lua'
          grep -F 'LastDiagnosisV2' 'Composition Studio.lua'
          ! grep -q 'osascript' 'Composition Studio.lua'
      - name: Commit
        run: |
          git config user.name 'wibem1'; git config user.email 'wibem1@googlemail.com'
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.9: prevent save-dialog API crash'
          git push origin HEAD:composition-studio
