name: Release v0514
on: push
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Patch v0.5.14
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Composition Studio.lua'); s=p.read_text()
          s=s.replace('-- @version 0.5.13','-- @version 0.5.14',1).replace('local VERSION="0.5.13"','local VERSION="0.5.14"',1)
          # Never synthesize the request itself into a fake title; empty means title recovery is needed.
          old=''' t=safe_work_title(t or "")\n if t=="" then t=safe_work_title(request or "") end\n if t=="" then t="Neue Komposition" end\n return t\nend'''
          new=''' t=safe_work_title(t or "")\n return t\nend'''
          if old not in s: raise SystemExit('title fallback block missing')
          s=s.replace(old,new,1)
          # Persist title in diagnosis too, so older/current title can be recovered independently of provider.
          s=s.replace('local keys={"version","provider","model","request"','local keys={"version","provider","model","work_title","request"',2)
          # On musical draft, persist actual title into diagnosis.
          old='work_title=title_from_draft(text,data.request); reaper.SetProjExtState(0,EXT_SECTION,TITLE_KEY,work_title); local tp='
          new='work_title=title_from_draft(text,data.request); if work_title~="" then reaper.SetProjExtState(0,EXT_SECTION,TITLE_KEY,work_title); diag_set("work_title",work_title) end; local tp='
          if old not in s: raise SystemExit('draft title capture missing')
          s=s.replace(old,new,1)
          # Title generation is a small separate provider-independent AI request only when title is missing.
          marker='local function summary_prompt('
          pos=s.index(marker)
          helper='''local function title_prompt()\n local draft=last_diag.musical_draft or ""; local req=last_diag.request or ""\n return [[Gib dieser vorhandenen Komposition einen kurzen, eigenständigen Werktitel. Antworte ausschließlich mit dem Titel, ohne Anführungszeichen, ohne „Titel:“ und ohne Erläuterung. Der Titel soll musikalisch passend sein und nicht bloß Instrumente oder den Auftrag wiederholen.]].."\\n\\nAUFTRAG:\\n"..req.."\\n\\nMUSIKALISCHER ENTWURF:\\n"..draft\nend\nlocal function ensure_title_then(kind)\n if safe_work_title(work_title)~="" then return false end\n local recovered=title_from_draft(last_diag.musical_draft or "",last_diag.request or "")\n if recovered~="" then work_title=recovered; reaper.SetProjExtState(0,EXT_SECTION,TITLE_KEY,work_title); diag_set("work_title",work_title); return false end\n local key=get_key(); if not key then update_status="Für die Titelermittlung fehlt der API-Key."; return true end\n update_status="KI findet einen Werktitel …"; launch("work_title",title_prompt(),key,{save_kind=kind}); return true\nend\n'''
          s=s[:pos]+helper+s[pos:]
          # Save actions recover title first; no placeholder names.
          old='''local function save_diagnosis()\n begin_save_panel("diagnosis","Diagnose speichern",safe_work_title(work_title~="" and work_title or "Composition Studio").." - Diagnose.json","json")\nend'''
          new='''local function save_diagnosis()\n if ensure_title_then("diagnosis") then return end\n begin_save_panel("diagnosis","Diagnose speichern",safe_work_title(work_title).." - Diagnose.json","json")\nend'''
          if old not in s: raise SystemExit('diagnosis save block missing')
          s=s.replace(old,new,1)
          old='begin_save_panel("midi","MIDI exportieren",safe_work_title(work_title~="" and work_title or "Neue Komposition")..".mid","mid")'
          new='if ensure_title_then("midi") then return end; begin_save_panel("midi","MIDI exportieren",safe_work_title(work_title)..".mid","mid")'
          if old not in s: raise SystemExit('midi save block missing')
          s=s.replace(old,new,1)
          # Handle title-only AI stage, then continue requested save operation.
          needle=''' if stage=="controller" then'''
          repl=''' if stage=="work_title" then\n  local t=safe_work_title(text:gsub("^[Tt][Ii][Tt][Ee][Ll]%s*:%s*","")); if t=="" then update_status="Kein brauchbarer Werktitel erhalten."; busy=false; return end\n  work_title=t; reaper.SetProjExtState(0,EXT_SECTION,TITLE_KEY,work_title); diag_set("work_title",work_title); busy=false\n  if data.save_kind=="midi" then export_last_midi() elseif data.save_kind=="diagnosis" then save_diagnosis() end; return\n end\n if stage=="controller" then'''
          if needle not in s: raise SystemExit('poll stage marker missing')
          s=s.replace(needle,repl,1)
          # Status label for title stage.
          s=s.replace('job.stage=="musical_draft" and "KI komponiert …"','job.stage=="work_title" and "KI findet einen Werktitel …" or job.stage=="musical_draft" and "KI komponiert …"',1)
          p.write_text(s)
          PY
      - name: Verify Lua and architecture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
          grep -q -- '-- @version 0.5.14' 'Composition Studio.lua'
          grep -q 'local VERSION="0.5.14"' 'Composition Studio.lua'
          grep -q 'stage=="work_title"' 'Composition Studio.lua'
          grep -q 'ensure_title_then' 'Composition Studio.lua'
          grep -q 'midi_translation_prompt' 'Composition Studio.lua'
          grep -q 'musical_draft' 'Composition Studio.lua'
          ! grep -q 't="Neue Komposition"' 'Composition Studio.lua'
      - name: Publish
        run: |
          git config user.name 'wibem1'
          git config user.email 'wibem1@googlemail.com'
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.14 recover meaningful work titles'
          git push origin HEAD:composition-studio
