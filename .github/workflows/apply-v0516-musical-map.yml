name: Apply Composition Studio v0.5.17 articulation
on: push
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Patch script
        shell: python
        run: |
          from pathlib import Path
          p=Path('Composition Studio.lua')
          s=p.read_text()
          s=s.replace('-- @version 0.5.16','-- @version 0.5.17',1).replace('local VERSION="0.5.16"','local VERSION="0.5.17"',1)
          a=s.index('local function midi_translation_prompt(request,draft)')
          b=s.index('\nlocal job=nil',a)
          prompt='''local function midi_translation_prompt(request,draft)\n return [[Du bist jetzt ausschließlich Notations- und MIDI-Übersetzer. Übertrage den folgenden bereits fertigen musikalischen Entwurf so vollständig und werkgetreu wie möglich in Composition-Studios MIDI-Daten. Komponiere NICHT neu, vereinfache NICHT, regularisiere NICHT den Rhythmus und ersetze keine ungewöhnlichen musikalischen Entscheidungen durch Standards. Bewahre insbesondere rhythmische Vielfalt, Pausen, Stimmführung, Phrasierung, Dynamik und Artikulation des Entwurfs.\nÜbertrage alle im Entwurf ausdrücklich vorgesehenen Tempo- und Taktartwechsel mit CSMETA. Erfinde keine Wechsel.\nCSMETA|tempo|startQN|BPM\nCSMETA|timesig|startQN|ZAEHLER|NENNER\nArtikulation und Dynamik müssen möglichst werkgetreu in MIDI erhalten bleiben: legato durch nahezu volle oder leicht überlappende Notendauern, staccato durch deutlich verkürzte Dauern, tenuto durch nahezu volle Dauer, Akzente/marcato durch passende Velocity. Crescendo und Diminuendo dürfen zusätzlich mit CC11 Expression übertragen werden. Ausdrücklich notierte instrumentale Spielweisen dürfen durch MIDI-Controller oder Program Changes umgesetzt werden; erfinde keine Spielweisen.\nErzeuge für jedes Instrument genau eine Zeile:\nCS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nZusätzlich sind bei Bedarf erlaubt:\nCSCTRL|NAME|startQN|CHANNEL|cc|CONTROLLER|VALUE\nCSCTRL|NAME|startQN|CHANNEL|program|PROGRAM\nNAME muss exakt dem NAME der CS-Zeile entsprechen. CHANNEL 0-15; CONTROLLER, VALUE und PROGRAM 0-127. PROGRAM der CS-Zeile ist General MIDI 0-127. startQN und durationQN dürfen beliebige sinnvolle Dezimalwerte haben. Antworte ausschließlich mit CSMETA-, CSCTRL- und CS-Zeilen.]].."\\n\\nURSPRÜNGLICHER AUFTRAG:\\n"..request.."\\n\\nFERTIGER MUSIKALISCHER ENTWURF:\\n"..draft\nend'''
          s=s[:a]+prompt+s[b:]
          a=s.index('local function apply_composition(text,items,tracks)')
          b=s.index('\nexport_last_midi=function()',a)
          old=s[a:b]
          old=old.replace('local jobs={}; local musical_map={};','local jobs={}; local musical_map={}; local controls={};',1)
          needle='''elseif ms then mq,num,den=tonumber(mq),tonumber(num),tonumber(den); if not mq or not num or not den or mq<0 or num<1 or den<1 then return nil,"Ungültige Taktartangabe." end; musical_map[#musical_map+1]={kind="timesig",qn=mq,num=math.floor(num),den=math.floor(den)} else local k,g,rest=line:match'''
          repl='''elseif ms then mq,num,den=tonumber(mq),tonumber(num),tonumber(den); if not mq or not num or not den or mq<0 or num<1 or den<1 then return nil,"Ungültige Taktartangabe." end; musical_map[#musical_map+1]={kind="timesig",qn=mq,num=math.floor(num),den=math.floor(den)} elseif line:match("^CSCTRL|") then local name,cq,ch,kind,rest=line:match("^CSCTRL|([^|]+)|([^|]+)|([^|]+)|([^|]+)|(.+)$"); cq,ch=tonumber(cq),tonumber(ch); if not name or not cq or not ch or cq<0 or ch<0 or ch>15 then return nil,"Ungültiges Ausdrucksereignis." end; if kind=="cc" then local cc,val=rest:match("^(%d+)|(%d+)$"); cc,val=tonumber(cc),tonumber(val); if not cc or not val or cc>127 or val>127 then return nil,"Ungültiges CC-Ausdrucksereignis." end; controls[#controls+1]={name=trim(name),qn=cq,ch=ch,kind="cc",a=cc,b=val} elseif kind=="program" then local pg=tonumber(rest); if not pg or pg<0 or pg>127 then return nil,"Ungültiger Program Change." end; controls[#controls+1]={name=trim(name),qn=cq,ch=ch,kind="program",a=math.floor(pg)} else return nil,"Unbekanntes Ausdrucksereignis." end else local k,g,rest=line:match'''
          assert needle in old
          old=old.replace(needle,repl,1)
          needle2='''for _,j in ipairs(jobs) do local tr;'''
          repl2='''local takes_by_name={}; for _,j in ipairs(jobs) do local tr;'''
          old=old.replace(needle2,repl2,1)
          needle3='''if not it then error("MIDI konnte nicht erzeugt werden") end; made[#made+1]=it end end,debug.traceback);'''
          repl3='''if not it then error("MIDI konnte nicht erzeugt werden") end; made[#made+1]=it; local tk=reaper.GetActiveTake(it); if tk then takes_by_name[j.name]=tk end end; for _,c in ipairs(controls) do local tk=takes_by_name[c.name]; if tk then local ppq=reaper.MIDI_GetPPQPosFromProjTime(tk,reaper.TimeMap2_QNToTime(0,c.qn)); if c.kind=="cc" then reaper.MIDI_InsertCC(tk,false,false,ppq,0xB0,c.ch,c.a,c.b) else reaper.MIDI_InsertCC(tk,false,false,ppq,0xC0,c.ch,c.a,0) end; reaper.MIDI_Sort(tk) end end end,debug.traceback);'''
          assert needle3 in old
          old=old.replace(needle3,repl3,1)
          s=s[:a]+old+s[b:]
          p.write_text(s)
      - name: Syntax and structural checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
          grep -q '@version 0.5.17' 'Composition Studio.lua'
          grep -q 'CSCTRL|NAME|startQN|CHANNEL|cc' 'Composition Studio.lua'
          grep -q 'CC11 Expression' 'Composition Studio.lua'
          grep -q 'takes_by_name' 'Composition Studio.lua'
          grep -q 'CountTempoTimeSigMarkers' 'Composition Studio.lua'
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.17: preserve articulation and expression'
          git push origin HEAD:composition-studio
