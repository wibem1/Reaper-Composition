name: Release v0511
on: push
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - run: python3 .github/v0511_builder.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - run: luac5.4 -p 'Composition Studio.lua'
      - run: grep -q 'local VERSION="0.5.11"' 'Composition Studio.lua'
      - run: grep -q 'choose file name' 'Composition Studio.lua'
      - run: grep -q 'midi_translation_prompt' 'Composition Studio.lua'
      - run: |
          git config user.name wibem1
          git config user.email wibem1@googlemail.com
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.11 native save panels'
          git push origin HEAD:composition-studio
