name: Build Composition Studio v0.5.3
on:
  push:
    paths:
      - '.github/workflows/build-v053.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Patch v0.5.3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Composition Studio.lua'); s=p.read_text()
          s=s.replace('-- @version 0.5.2','-- @version 0.5.3',1).replace('local VERSION="0.5.2"','local VERSION="0.5.3"',1)
          marker='local function composition_prompt(request,items,tracks,is_new) return '
          a=s.index(marker); b=s.index('\nlocal function process(request)',a)
          new='''local function composition_prompt(request,items,tracks,is_new)\n if is_new then\n  return [[Du komponierst eine vollständig neue, eigenständige Musik in Composition Studio. Es gibt für diesen Auftrag KEIN vorhandenes Stück, KEINE frühere Taktzahl, KEINE Auswahl und KEINEN markierten Zeitbereich. Beziehe dich ausschließlich auf den aktuellen Auftrag. Wenn der Auftrag keine Länge nennt, wähle die musikalisch sinnvolle Länge selbst und leite sie aus keiner früheren Information ab. Erzeuge für jedes verlangte Instrument eine eigene CS|new-Zeile. Jedes neue MIDI-Item erhält einen passenden General-MIDI-Program-Change 0-127.\nAntworte ausschließlich:\nCS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nPROGRAM ist die GM-Programmnummer 0-127.]].."\\nAKTUELLER, VOLLSTÄNDIG ISOLIERTER AUFTRAG:\\n"..request\n end\n return [[Du komponierst Musik in Composition Studio. Nutze das konkret übergebene vorhandene Material als musikalischen Kontext und erfülle den freien Auftrag eigenständig; füge keine unnötigen Regeln hinzu. TIME_SELECTION ist nur bei ausdrücklichem Bezug auf den markierten Bereich ein Zielbereich. Eine ausgewählte TRACK_GUID kann auch ohne ausgewähltes MIDI-Item direkt Ziel sein. Jedes neu erzeugte MIDI-Item MUSS einen passenden General-MIDI-Program-Change (0-127) erhalten.\nAntworte ausschließlich:\nCS|unchanged|SOURCE_GUID\nCS|target|SOURCE_GUID|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nCS|track|TRACK_GUID|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nCS|revised|SOURCE_GUID|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nCS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...]].."\\nAUFTRAG:\\n"..request.."\\nMUSIK:\\n"..music_context(items,tracks,false)\nend'''
          s=s[:a]+new+s[b:]
          a=s.index('local function process(request)'); b=s.index('\nlocal function submit()',a)
          new='''local job=nil\nlocal function ai_command(prompt,key)\n local base=os.tmpname(); local rq,rs,cd=base..".json",base..".out",base..".code"; local body,url,headers\n if provider=="openai" then body='{\\"model\\":\\"'..json_escape(model)..'\\",\\"input\\":\\"'..json_escape(prompt)..'\\"}'; url="https://api.openai.com/v1/responses"; headers="-H "..shell_quote("Authorization: Bearer "..key).." -H 'Content-Type: application/json'"\n elseif provider=="anthropic" then body='{\\"model\\":\\"'..json_escape(model)..'\\",\\"max_tokens\\":16000,\\"messages\\":[{\\"role\\":\\"user\\",\\"content\\":\\"'..json_escape(prompt)..'\\"}]}'; url="https://api.anthropic.com/v1/messages"; headers="-H "..shell_quote("x-api-key: "..key).." -H 'anthropic-version: 2023-06-01' -H 'Content-Type: application/json'"\n else body='{\\"contents\\":[{\\"parts\\":[{\\"text\\":\\"'..json_escape(prompt)..'\\"}]}]}'; url="https://generativelanguage.googleapis.com/v1beta/models/"..model..":generateContent?key="..key; headers="-H 'Content-Type: application/json'" end\n if not write_file(rq,body) then return nil,"Anfrage konnte nicht geschrieben werden." end\n os.execute("/usr/bin/curl -sS --max-time 180 -o "..shell_quote(rs).." -w '%{http_code}' "..headers.." --data-binary @"..shell_quote(rq).." "..shell_quote(url).." > "..shell_quote(cd).." 2>/dev/null &"); return {rq=rq,rs=rs,cd=cd,provider=provider},nil\nend\nlocal function ai_poll(a) local status=read_file(a.cd); if not status or trim(status)=="" then return nil,nil,false end; status=trim(status); local raw=read_file(a.rs); os.remove(a.rq); os.remove(a.rs); os.remove(a.cd); if status~="200" or not raw then return nil,"KI-Aufruf fehlgeschlagen (HTTP "..tostring(status)..").",true end; local text=a.provider=="openai" and response_text(raw) or first_text_field(raw); if not text or trim(text)=="" then return nil,"KI-Antwort konnte nicht gelesen werden.",true end; return text,nil,true end\nlocal function launch(stage,prompt,key,data) local a,e=ai_command(prompt,key); if not a then add("KI",e); busy=false; job=nil; return false end; job={stage=stage,ai=a,key=key,data=data or {}}; return true end\nlocal function begin_process(request) last_diag={version=VERSION,provider=provider,model=model,request=request}; local key=get_key(); if not key then add("KI","Kein API-Key für "..provider_name().." verfügbar."); busy=false; return end; local items=selected_items(false); local tracks=selected_tracks(); diag_set("context",compact_context(items,tracks,false)); local prompt=CONTROLLER.."\\n\\nBISHERIGER DIALOG:\\n"..recent_dialog().."\\n\\nAKTUELLER AUFTRAG:\\n"..request.."\\n\\nKOMPAKTER REAPER-KONTEXT:\\n"..compact_context(items,tracks,false); diag_set("controller_prompt",prompt); launch("controller",prompt,key,{request=request,items=items,tracks=tracks}) end\nlocal function summary_prompt(request,comp) return [[Fasse die soeben erzeugte MIDI-Komposition knapp in 2 bis 4 Sätzen zusammen. Nenne Tempo/BPM, die aus den Noten plausibel erkennbare Tonart bzw. falls nicht eindeutig 'tonales Zentrum nicht eindeutig', den Umfang in Takten soweit aus den QN-Daten ableitbar, und die musikalische Idee/Charakteristik. Keine langen Erklärungen. Erfinde keine Angaben.]].."\\nREAPER-TEMPO: "..string.format("%.2f BPM",reaper.Master_GetTempo()).."\\nAUFTRAG: "..request.."\\nMIDI-DATEN:\\n"..comp end\nlocal function poll_job()\n if not job then return end; local text,e,done=ai_poll(job.ai); if not done then return end; local stage,data,key=job.stage,job.data,job.key; job=nil; if not text then add("KI",e); busy=false; return end; text=trim(text)\n if stage=="controller" then diag_set("controller_answer",text); local chat=text:match("^CHAT|(.*)$"); if chat then add("KI",trim(chat)); busy=false; return end; local ask=text:match("^ASK|(.*)$"); if ask then add("KI",trim(ask)); busy=false; return end; local awhy=text:match("^NEED_ANALYSIS|(.*)$"); if awhy then local full=selected_items(true); if #full==0 and #data.tracks>0 then full=track_context_items(data.tracks) end; if #full==0 then add("KI","Für die Analyse ist kein MIDI-Material ausgewählt."); busy=false; return end; launch("analysis",analysis_prompt(data.request,full,data.tracks),key,data); return end; local newwhy=text:match("^NEED_NEW|(.*)$"); local why=text:match("^NEED_MUSIC|(.*)$"); if newwhy or why then local full=newwhy and {} or selected_items(true); local tracks=newwhy and {} or data.tracks; if #full==0 and #tracks>0 then full=track_context_items(tracks) end; local cp=composition_prompt(data.request,full,tracks,newwhy~=nil); diag_set("composition_prompt",cp); data.full=full; data.music_tracks=tracks; launch("composition",cp,key,data); return end; if text:match("^ACTION|") then local ac,pe=parse_action(text,data.items); if not ac then add("KI","Ich führe nichts aus: "..pe); busy=false; return end; local ok,ae=execute_action(ac); if not ok then add("KI","Die Aktion wurde nicht ausgeführt: "..tostring(ae)); else add("KI",trim(ac.desc).." – erledigt. REAPER Undo kann die Änderung rückgängig machen.") end; busy=false; return end; add("KI","Ich konnte den Auftrag nicht eindeutig einem sicheren Vorgang zuordnen und habe nichts verändert."); busy=false; return\n elseif stage=="analysis" then add("KI",text); busy=false; return\n elseif stage=="composition" then diag_set("composition_answer",text); local made,ae=apply_composition(text,data.full,data.music_tracks); diag_set("apply_result",made and ("created_items="..tostring(#made)) or ("ERROR: "..tostring(ae))); if not made then add("KI","Die musikalische Antwort konnte nicht sicher angewendet werden: "..tostring(ae)); busy=false; return end; local htr,hsl=initialize_halion_project(); diag_set("halion_result",string.format("auto_initialized_tracks=%d slots=%d",htr,hsl)); data.comp=text; launch("summary",summary_prompt(data.request,text),key,data); return\n elseif stage=="summary" then add("KI",text); busy=false; return end\nend'''
          s=s[:a]+new+s[b:]
          old='local function submit() local r=trim(input); if r=="" or busy then return end; input=""; info_visible=false; history_mode=false; add("Du",r); busy=true; process(r); busy=false end'
          assert old in s; s=s.replace(old,'local function submit() local r=trim(input); if r=="" or busy then return end; input=""; info_visible=false; history_mode=false; add("Du",r); busy=true; begin_process(r) end',1)
          old='if update_status~="" then reaper.ImGui_TextWrapped(ctx,update_status) end; reaper.ImGui_Separator(ctx);'; assert old in s
          s=s.replace(old,'if update_status~="" then reaper.ImGui_TextWrapped(ctx,update_status) end; if busy and job then local pc=false; if type(reaper.ImGui_PushStyleColor)=="function" and type(reaper.ImGui_Col_Text)=="function" then reaper.ImGui_PushStyleColor(ctx,reaper.ImGui_Col_Text(),0x35C759FF); pc=true end; reaper.ImGui_Text(ctx,job.stage=="composition" and "KI komponiert …" or job.stage=="summary" and "KI beschreibt das Stück …" or "KI arbeitet …"); if pc then reaper.ImGui_PopStyleColor(ctx) end end; reaper.ImGui_Separator(ctx);',1)
          old='local function loop() if not open then'; assert old in s; s=s.replace(old,'local function loop() poll_job(); if not open then',1)
          p.write_text(s)
          PY
      - name: Lua syntax check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
      - name: Verify release markers
        run: |
          grep -q -- '-- @version 0.5.3' 'Composition Studio.lua'
          grep -q 'local VERSION="0.5.3"' 'Composition Studio.lua'
          grep -q 'KI komponiert' 'Composition Studio.lua'
          grep -q 'VOLLSTÄNDIG ISOLIERTER AUFTRAG' 'Composition Studio.lua'
          grep -q 'summary_prompt' 'Composition Studio.lua'
      - name: Commit v0.5.3
        run: |
          git config user.name 'Composition Studio Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.3 async composition status and musical summary'
          git push origin HEAD:composition-studio
# trigger 2