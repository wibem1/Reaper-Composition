name: Build Composition Studio v0.5.6
on:
  push:
    paths: ['.github/workflows/build-v056.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Patch native macOS save dialog
        shell: python
        run: |
          from pathlib import Path
          p=Path('Composition Studio.lua'); s=p.read_text()
          s=s.replace('-- @version 0.5.5','-- @version 0.5.6',1).replace('local VERSION="0.5.5"','local VERSION="0.5.6"',1)
          a=s.index('local function save_path_dialog'); b=s.index('local function save_diagnosis()',a)
          new='''local function save_path_dialog(title,suggested,ext)\n -- Native macOS Save panel via AppleScript; no JS_ReaScriptAPI dependency.\n local script=os.tmpname()..".applescript"; local out=os.tmpname()..".path"\n local function aq(v) return tostring(v or ""):gsub("\\\\","\\\\\\\\"):gsub('"','\\\\"') end\n local as='try\\nset f to choose file name with prompt "'..aq(title)..'" default name "'..aq(suggested)..'"\\nPOSIX path of f\\non error number -128\\nreturn ""\\nend try\\n'\n if not write_file(script,as) then update_status="Speichern-Dialog konnte nicht vorbereitet werden."; return nil end\n os.execute("/usr/bin/osascript "..shell_quote(script).." > "..shell_quote(out).." 2>/dev/null")\n local fn=trim(read_file(out)); os.remove(script); os.remove(out)\n if not fn or fn=="" then return nil end\n if not fn:lower():match("%."..ext.."$") then fn=fn.."."..ext end\n return fn\nend\n'''
          s=s[:a]+new+s[b:]
          s=s.replace(' if type(reaper.JS_Dialog_BrowseForSaveFile)~="function" then update_status="Speichern-Dialog benötigt JS_ReaScriptAPI."; return end\n','',2)
          p.write_text(s)
      - name: Lua syntax check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 && luac5.4 -p 'Composition Studio.lua'
      - name: Verify v0.5.6
        run: |
          grep -F -- '-- @version 0.5.6' 'Composition Studio.lua'
          grep -F 'local VERSION="0.5.6"' 'Composition Studio.lua'
          grep -F '/usr/bin/osascript' 'Composition Studio.lua'
          grep -F 'choose file name with prompt' 'Composition Studio.lua'
          if grep -F 'JS_Dialog_BrowseForSaveFile' 'Composition Studio.lua'; then exit 1; fi
          grep -F 'local smf="MThd"' 'Composition Studio.lua'
      - name: Commit
        run: |
          git config user.name 'wibem1'
          git config user.email 'wibem1@googlemail.com'
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.6: native macOS save dialogs'
          git push origin HEAD:composition-studio
