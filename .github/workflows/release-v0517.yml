name: Release v0517
on:
  push:
    paths:
      - '.github/workflows/release-v0517.yml'
jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Apply v0.5.17
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('Composition Studio.lua')
          s=p.read_text()
          s=s.replace('-- @version 0.5.16','-- @version 0.5.17',1).replace('local VERSION="0.5.16"','local VERSION="0.5.17"',1)

          a=s.index('local function midi_translation_prompt(request,draft)')
          b=s.index('\nlocal job=nil',a)
          prompt=r'''local function midi_translation_prompt(request,draft)
 return [[Du bist jetzt ausschließlich Notations- und MIDI-Übersetzer. Übertrage den folgenden bereits fertigen musikalischen Entwurf so vollständig und werkgetreu wie möglich in Composition-Studios MIDI-Daten. Komponiere NICHT neu, vereinfache NICHT, regularisiere NICHT den Rhythmus und ersetze keine ungewöhnlichen musikalischen Entscheidungen durch Standards. Bewahre insbesondere rhythmische Vielfalt, Pausen, Stimmführung, Phrasierung, Dynamik und Artikulation des Entwurfs.
Übertrage alle im Entwurf ausdrücklich vorgesehenen Tempo- und Taktartwechsel. Verwende dafür vor den Instrumentzeilen bei Bedarf:
CSMETA|tempo|startQN|BPM
CSMETA|timesig|startQN|ZAEHLER|NENNER
Wenn der Entwurf nur ein Anfangstempo oder eine Anfangstaktart nennt, setze startQN=0. Erfinde keine Wechsel, die im Entwurf nicht vorgesehen sind.

Übertrage Artikulation und Dynamik möglichst werkgetreu statt sie zu verwerfen:
- legato durch nahezu volle bzw. leicht überlappende Notendauern,
- staccato durch deutlich verkürzte Notendauern,
- tenuto durch nahezu volle Notendauer,
- Akzente/marcato durch passende Velocity,
- Crescendo/Diminuendo zusätzlich durch CC11 Expression, wenn der Entwurf einen Verlauf verlangt.
Für ausdrücklich notierte instrumentale Spielweisen, die eine MIDI-Umschaltung benötigen, sind Controller- bzw. Program-Change-Ereignisse erlaubt. Bei General-MIDI-Streichern kann z.B. ein ausdrücklich verlangtes pizzicato über das passende GM-Programm und die Rückkehr zu arco über das Grundprogramm abgebildet werden. Erfinde keine Spielweisen und keine Umschaltungen.

Erzeuge für jedes Instrument genau eine Zeile:
CS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...
PROGRAM ist General MIDI 0-127. startQN und durationQN dürfen beliebige sinnvolle Dezimalwerte haben.
Zusätzlich sind bei Bedarf erlaubt:
CSCTRL|NAME|startQN|CHANNEL|cc|CONTROLLER|VALUE
CSCTRL|NAME|startQN|CHANNEL|program|PROGRAM
NAME muss exakt dem NAME der zugehörigen CS-Zeile entsprechen. CHANNEL 0-15, CONTROLLER/VALUE/PROGRAM 0-127.
Antworte ausschließlich mit CSMETA-, CSCTRL- und CS-Zeilen.]].."\n\nURSPRÜNGLICHER AUFTRAG:\n"..request.."\n\nFERTIGER MUSIKALISCHER ENTWURF:\n"..draft
end'''
          s=s[:a]+prompt+s[b:]

          a=s.index('local function apply_composition(text,items,tracks)')
          b=s.index('\nexport_last_midi=function()',a)
          fn=r'''local function apply_composition(text,items,tracks)
 local src,targets={},{}
 for _,it in ipairs(items) do src[it.guid]=it end
 for _,t in ipairs(tracks or {}) do targets[t.guid]=t.track end
 local jobs,musical_map,controls={},{},{}
 for line in text:gmatch("[^\r\n]+") do
  line=trim(line)
  local mt,q,bpm=line:match("^CSMETA|(tempo)|([^|]+)|([^|]+)$")
  local ms,mq,num,den=line:match("^CSMETA|(timesig)|([^|]+)|([^|]+)|([^|]+)$")
  if mt then
   q,bpm=tonumber(q),tonumber(bpm); if not q or not bpm or q<0 or bpm<=0 then return nil,"Ungültige Tempoangabe." end
   musical_map[#musical_map+1]={kind="tempo",qn=q,bpm=bpm}
  elseif ms then
   mq,num,den=tonumber(mq),tonumber(num),tonumber(den); if not mq or not num or not den or mq<0 or num<1 or den<1 then return nil,"Ungültige Taktartangabe." end
   musical_map[#musical_map+1]={kind="timesig",qn=mq,num=math.floor(num),den=math.floor(den)}
  elseif line:match("^CSCTRL|") then
   local name,cq,ch,kind,rest=line:match("^CSCTRL|([^|]+)|([^|]+)|([^|]+)|([^|]+)|(.+)$")
   cq,ch=tonumber(cq),tonumber(ch)
   if not name or not cq or not ch or cq<0 or ch<0 or ch>15 then return nil,"Ungültiges Ausdrucksereignis." end
   if kind=="cc" then
    local cc,val=rest:match("^(%d+)|(%d+)$"); cc,val=tonumber(cc),tonumber(val)
    if not cc or not val or cc>127 or val>127 then return nil,"Ungültiges CC-Ausdrucksereignis." end
    controls[#controls+1]={name=trim(name),qn=cq,ch=ch,kind="cc",a=cc,b=val}
   elseif kind=="program" then
    local pg=tonumber(rest); if not pg or pg<0 or pg>127 then return nil,"Ungültiger Program Change." end
    controls[#controls+1]={name=trim(name),qn=cq,ch=ch,kind="program",a=math.floor(pg)}
   else return nil,"Unbekanntes Ausdrucksereignis." end
  else
   local k,g,rest=line:match("^CS|([^|]+)|([^|]+)|?(.*)$")
   if not k then return nil,"Unerwartete Kompositionsantwort." end
   if k=="unchanged" then
    if not src[g] then return nil,"Unbekannte Quelle." end
   elseif k=="revised" or k=="target" or k=="track" or k=="new" then
    local name,pg,nt=rest:match("^([^|]+)|(%d+)|(.+)$"); local notes=parse_notes(nt); local program=tonumber(pg)
    if not name or not notes or not program or program<0 or program>127 then return nil,"Ungültige Kompositionsdaten." end
    if (k=="revised" or k=="target") and not src[g] then return nil,"Unbekannte Quelle." end
    if k=="track" and not targets[g] then return nil,"Unbekannte Zielspur." end
    if k=="new" and g~="-" then return nil,"Ungültige neue Spur." end
    jobs[#jobs+1]={kind=k,guid=g,name=trim(name),program=program_for_name(name,program),notes=notes}
   else return nil,"Unbekannter Ergebnistyp." end
  end
 end
 reaper.Undo_BeginBlock2(0); local made={}
 local ok,err=xpcall(function()
  if #musical_map>0 then
   for i=reaper.CountTempoTimeSigMarkers(0)-1,0,-1 do reaper.DeleteTempoTimeSigMarker(0,i) end
   table.sort(musical_map,function(x,y) return x.qn<y.qn end); local cur_bpm=reaper.Master_GetTempo(); local cur_num,cur_den=4,4
   for _,m in ipairs(musical_map) do if m.kind=="tempo" then cur_bpm=m.bpm else cur_num,cur_den=m.num,m.den end; local tm=reaper.TimeMap2_QNToTime(0,m.qn); reaper.SetTempoTimeSigMarker(0,-1,tm,-1,-1,cur_bpm,cur_num,cur_den,false) end
  end
  local takes_by_name={}
  for _,j in ipairs(jobs) do
   local tr
   if j.kind=="revised" then local no=math.floor(reaper.GetMediaTrackInfo_Value(src[j.guid].track,"IP_TRACKNUMBER")); tr=create_track(j.name.." [Variante]",no)
   elseif j.kind=="target" then tr=src[j.guid].track
   elseif j.kind=="track" then tr=targets[j.guid]
   else tr=create_track(j.name) end
   local inherited=(j.kind~="new") and existing_program(tr) or nil; local it=create_midi(tr,j.name,j.notes,inherited or j.program); if not it then error("MIDI konnte nicht erzeugt werden") end
   made[#made+1]=it; local take=reaper.GetActiveTake(it); if take then takes_by_name[j.name]=take end
  end
  for _,c in ipairs(controls) do
   local take=takes_by_name[c.name]; if take then
    local ppq=reaper.MIDI_GetPPQPosFromProjTime(take,reaper.TimeMap2_QNToTime(0,c.qn))
    if c.kind=="cc" then reaper.MIDI_InsertCC(take,false,false,ppq,0xB0,c.ch,c.a,c.b) else reaper.MIDI_InsertCC(take,false,false,ppq,0xC0,c.ch,c.a,0) end
    reaper.MIDI_Sort(take)
   end
  end
 end,debug.traceback)
 if not ok then reaper.Undo_EndBlock2(0,"Composition Studio – fehlgeschlagen",-1); reaper.Undo_DoUndo2(0); return nil,err end
 reaper.UpdateArrange(); reaper.Undo_EndBlock2(0,"Composition Studio – KI-Komposition",-1); return made
end'''
          s=s[:a]+fn+s[b:]
          p.write_text(s)
      - name: Lua syntax and invariant checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
          grep -F 'local VERSION="0.5.17"' 'Composition Studio.lua'
          grep -F 'CSCTRL|NAME|startQN|CHANNEL|cc|CONTROLLER|VALUE' 'Composition Studio.lua'
          grep -F 'Crescendo/Diminuendo zusätzlich durch CC11 Expression' 'Composition Studio.lua'
          grep -F 'reaper.MIDI_InsertCC(take,false,false,ppq,0xC0' 'Composition Studio.lua'
          grep -F 'CSMETA|tempo|startQN|BPM' 'Composition Studio.lua'
      - name: Commit v0.5.17
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Composition Studio.lua'
          git commit -m 'Release Composition Studio v0.5.17 articulation translation'
          git push origin composition-studio
