name: Release v0516
on:
  push:
    paths:
      - '.github/workflows/release-v0516.yml'
jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Apply v0.5.16 migration
        shell: python
        run: |
          from pathlib import Path
          p=Path('Composition Studio.lua')
          s=p.read_text()
          s=s.replace('-- @version 0.5.15','-- @version 0.5.16',1).replace('local VERSION="0.5.15"','local VERSION="0.5.16"',1)

          old='''local function midi_translation_prompt(request,draft)\n return [[Du bist jetzt ausschließlich Notations- und MIDI-Übersetzer. Übertrage den folgenden bereits fertigen musikalischen Entwurf so vollständig und werkgetreu wie möglich in Composition-Studios MIDI-Daten. Komponiere NICHT neu, vereinfache NICHT, regularisiere NICHT den Rhythmus und ersetze keine ungewöhnlichen musikalischen Entscheidungen durch Standards. Bewahre insbesondere rhythmische Vielfalt, Pausen, Stimmführung und Phrasierung des Entwurfs.\nErzeuge für jedes Instrument genau eine Zeile:\nCS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nPROGRAM ist General MIDI 0-127. startQN und durationQN dürfen beliebige sinnvolle Dezimalwerte haben. Antworte ausschließlich mit CS-Zeilen.]].."\\n\\nURSPRÜNGLICHER AUFTRAG:\\n"..request.."\\n\\nFERTIGER MUSIKALISCHER ENTWURF:\\n"..draft\nend'''
          new='''local function midi_translation_prompt(request,draft)\n return [[Du bist jetzt ausschließlich Notations- und MIDI-Übersetzer. Übertrage den folgenden bereits fertigen musikalischen Entwurf so vollständig und werkgetreu wie möglich in Composition-Studios MIDI-Daten. Komponiere NICHT neu, vereinfache NICHT, regularisiere NICHT den Rhythmus und ersetze keine ungewöhnlichen musikalischen Entscheidungen durch Standards. Bewahre insbesondere rhythmische Vielfalt, Pausen, Stimmführung, Phrasierung, Dynamik, Artikulation, Tempoänderungen und Taktartwechsel des Entwurfs.\n\nTechnische Umsetzung musikalischer Ausdrucksangaben:\n- Tempo- und Taktartangaben des Entwurfs MÜSSEN als CSMETA-Zeilen übertragen werden.\n- Artikulationen auf Notenebene werden werkgetreu durch Notendauer/Gate und Velocity abgebildet: legato mit verbundenen bzw. leicht überlappenden Noten, staccato deutlich verkürzt, tenuto nahezu volle Dauer, Akzente/marcato mit entsprechender Velocity.\n- Dynamische Verläufe werden zusätzlich, soweit sinnvoll, durch CC11 Expression übertragen.\n- Instrumentale Spielweisen, für die General MIDI eine eigene Klangfarbe bereitstellt (z.B. pizzicato strings), dürfen durch CSCTRL-Program-Change-Ereignisse abgebildet und anschließend wieder auf die Grundklangfarbe zurückgeführt werden. Erfinde solche Wechsel nicht; übertrage sie nur, wenn sie im Entwurf stehen.\n\nErzeuge für jedes Instrument genau eine CS-Zeile:\nCS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nPROGRAM ist General MIDI 0-127. startQN und durationQN dürfen beliebige sinnvolle Dezimalwerte haben.\n\nZusätzlich sind folgende Zeilen erlaubt und bei entsprechenden Angaben im Entwurf erforderlich:\nCSMETA|tempo|QN|BPM\nCSMETA|timesig|QN|NUMERATOR|DENOMINATOR\nCSCTRL|TRACKNAME|QN|CHANNEL|cc|CONTROLLER|VALUE\nCSCTRL|TRACKNAME|QN|CHANNEL|program|PROGRAM\nTRACKNAME muss exakt dem NAME der zugehörigen CS-Zeile entsprechen. CHANNEL ist 0-15, CONTROLLER/VALUE/PROGRAM 0-127.\nAntworte ausschließlich mit CS-, CSMETA- und CSCTRL-Zeilen.]].."\\n\\nURSPRÜNGLICHER AUFTRAG:\\n"..request.."\\n\\nFERTIGER MUSIKALISCHER ENTWURF:\\n"..draft\nend'''
          if old not in s: raise SystemExit('translation prompt anchor missing')
          s=s.replace(old,new,1)

          anchor='''local function apply_composition(text,items,tracks) local src,targets={},{ };'''
          helper='''local function parse_expressive_events(text)\n local meta,ctrl={},{}\n for line in (text or ""):gmatch("[^\\r\\n]+") do\n  line=trim(line)\n  local q,bpm=line:match("^CSMETA|tempo|([%d%.%-]+)|([%d%.%-]+)$")\n  if q then q,bpm=tonumber(q),tonumber(bpm); if q and bpm and q>=0 and bpm>0 then meta[#meta+1]={kind="tempo",qn=q,bpm=bpm} end end\n  local tq,nn,dd=line:match("^CSMETA|timesig|([%d%.%-]+)|(%d+)|(%d+)$")\n  if tq then tq,nn,dd=tonumber(tq),tonumber(nn),tonumber(dd); if tq and nn and dd and tq>=0 and nn>0 and dd>0 then meta[#meta+1]={kind="timesig",qn=tq,num=nn,den=dd} end end\n  local tn,cq,ch,typ,a,b=line:match("^CSCTRL|([^|]+)|([%d%.%-]+)|(%d+)|([^|]+)|(%d+)|?(%d*)$")\n  if tn then cq,ch,a,b=tonumber(cq),tonumber(ch),tonumber(a),tonumber(b); if cq and ch and a and cq>=0 and ch>=0 and ch<=15 then ctrl[#ctrl+1]={track=trim(tn),qn=cq,ch=ch,kind=typ,a=a,b=b} end end\n end\n return meta,ctrl\nend\nlocal function apply_project_meta(meta)\n if #meta==0 then return end\n local byqn={}\n for _,e in ipairs(meta) do local k=string.format("%.6f",e.qn); byqn[k]=byqn[k] or {qn=e.qn}; if e.kind=="tempo" then byqn[k].bpm=e.bpm else byqn[k].num=e.num; byqn[k].den=e.den end end\n local keys={}; for _,e in pairs(byqn) do keys[#keys+1]=e end; table.sort(keys,function(a,b) return a.qn<b.qn end)\n for _,e in ipairs(keys) do\n  local time=reaper.TimeMap2_QNToTime(0,e.qn); local bpm=e.bpm or reaper.TimeMap_GetDividedBpmAtTime(time); local num,den=e.num,e.den\n  if not num or not den then local _,n,d=reaper.TimeMap_GetTimeSigAtTime(0,time); num=num or n or 4; den=den or d or 4 end\n  reaper.SetTempoTimeSigMarker(0,-1,time,-1,-1,bpm,num,den,false)\n end\nend\nlocal function apply_ctrl_events(ctrl,made)\n if #ctrl==0 then return end\n local byname={}\n for _,it in ipairs(made or {}) do local take=reaper.GetActiveTake(it); if take then local _,n=reaper.GetSetMediaItemTakeInfo_String(take,"P_NAME","",false); if n and n~="" then byname[n]=take end end end\n for _,e in ipairs(ctrl) do local take=byname[e.track]; if take then local ppq=reaper.MIDI_GetPPQPosFromProjTime(take,reaper.TimeMap2_QNToTime(0,e.qn)); if e.kind=="cc" and e.b then reaper.MIDI_InsertCC(take,false,false,ppq,0xB0,e.ch,math.max(0,math.min(127,e.a)),math.max(0,math.min(127,e.b))) elseif e.kind=="program" then reaper.MIDI_InsertCC(take,false,false,ppq,0xC0,e.ch,math.max(0,math.min(127,e.a)),0) end; reaper.MIDI_Sort(take) end end\nend\n'''+anchor
          if anchor not in s: raise SystemExit('apply anchor missing')
          s=s.replace(anchor,helper,1)

          # Ignore expressive protocol lines in the existing CS score parser.
          oldloop='''for line in text:gmatch("[^\\r\\n]+") do local k,g,rest=trim(line):match("^CS|([^|]+)|([^|]+)|?(.*)$"); if not k then return nil,"Unerwartete Kompositionsantwort." end;'''
          newloop='''for line in text:gmatch("[^\\r\\n]+") do line=trim(line); if not line:match("^CSMETA|") and not line:match("^CSCTRL|") then local k,g,rest=line:match("^CS|([^|]+)|([^|]+)|?(.*)$"); if not k then return nil,"Unerwartete Kompositionsantwort." end;'''
          if oldloop not in s: raise SystemExit('CS parser loop anchor missing')
          s=s.replace(oldloop,newloop,1)
          oldend='''else return nil,"Unbekannter Ergebnistyp." end end; reaper.Undo_BeginBlock2(0);'''
          newend='''else return nil,"Unbekannter Ergebnistyp." end end end; reaper.Undo_BeginBlock2(0);'''
          if oldend not in s: raise SystemExit('CS parser loop end anchor missing')
          s=s.replace(oldend,newend,1)

          # Apply metadata and expressive controllers after score materialization.
          oldapply='''if not made then add("KI","Die musikalische Antwort konnte nicht sicher angewendet werden: "..tostring(ae)); busy=false; return end; local htr,hsl=initialize_halion_project();'''
          newapply='''if not made then add("KI","Die musikalische Antwort konnte nicht sicher angewendet werden: "..tostring(ae)); busy=false; return end; local meta,ctrl=parse_expressive_events(text); apply_project_meta(meta); apply_ctrl_events(ctrl,made); diag_set("expressive_events",string.format("meta=%d ctrl=%d",#meta,#ctrl)); local htr,hsl=initialize_halion_project();'''
          if oldapply not in s: raise SystemExit('composition apply anchor missing')
          s=s.replace(oldapply,newapply,1)

          # Export the actual REAPER tempo/time-signature map instead of one fixed master tempo.
          oldtempo='''local ppq=960; local chunks={}; local tempo=math.max(1,reaper.Master_GetTempo()); local us=math.floor(60000000/tempo+0.5); local tempo_data=string.char(0xFF,0x51,0x03,math.floor(us/65536)%256,math.floor(us/256)%256,us%256); chunks[#chunks+1]=midi_track_chunk({{tick=0,order=0,data=tempo_data}},"Tempo")'''
          newtempo='''local ppq=960; local chunks={}; local conductor={}\n local function add_tempo_event(qn,bpm) local us=math.floor(60000000/math.max(1,bpm)+0.5); conductor[#conductor+1]={tick=math.max(0,math.floor(qn*ppq+0.5)),order=0,data=string.char(0xFF,0x51,0x03,math.floor(us/65536)%256,math.floor(us/256)%256,us%256)} end\n local function add_timesig_event(qn,num,den) local dd=0; local d=math.max(1,den or 4); while d>1 do d=math.floor(d/2); dd=dd+1 end; conductor[#conductor+1]={tick=math.max(0,math.floor(qn*ppq+0.5)),order=1,data=string.char(0xFF,0x58,0x04,math.max(1,math.min(255,num or 4)),dd,24,8)} end\n local tc=reaper.CountTempoTimeSigMarkers(0); if tc==0 then add_tempo_event(0,reaper.Master_GetTempo()); local _,n,d=reaper.TimeMap_GetTimeSigAtTime(0,0); add_timesig_event(0,n or 4,d or 4) else for i=0,tc-1 do local ok,time,_,_,bpm,num,den=reaper.GetTempoTimeSigMarker(0,i); if ok then local qn=reaper.TimeMap2_timeToQN(0,time); add_tempo_event(qn,bpm); add_timesig_event(qn,num,den) end end end; chunks[#chunks+1]=midi_track_chunk(conductor,"Tempo")'''
          if oldtempo not in s: raise SystemExit('MIDI export tempo anchor missing')
          s=s.replace(oldtempo,newtempo,1)

          p.write_text(s)
      - name: Install Lua and syntax-check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
          grep -F 'local VERSION="0.5.16"' 'Composition Studio.lua'
          grep -F 'CSMETA|tempo|QN|BPM' 'Composition Studio.lua'
          grep -F 'CSMETA|timesig|QN|NUMERATOR|DENOMINATOR' 'Composition Studio.lua'
          grep -F 'CSCTRL|TRACKNAME|QN|CHANNEL|cc|CONTROLLER|VALUE' 'Composition Studio.lua'
          grep -F 'apply_project_meta(meta)' 'Composition Studio.lua'
          grep -F 'apply_ctrl_events(ctrl,made)' 'Composition Studio.lua'
          grep -F 'CountTempoTimeSigMarkers' 'Composition Studio.lua'
      - name: Commit v0.5.16
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Composition Studio.lua'
          git commit -m 'Release Composition Studio v0.5.16 expressive translation'
          git push origin composition-studio
