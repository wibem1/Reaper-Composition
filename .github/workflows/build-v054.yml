name: Build Composition Studio v0.5.4
on:
  push:
    paths: ['.github/workflows/build-v054.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: composition-studio}
      - name: Patch v0.5.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Composition Studio.lua'); s=p.read_text()
          s=s.replace('-- @version 0.5.3','-- @version 0.5.4',1).replace('local VERSION="0.5.3"','local VERSION="0.5.4"',1)
          s=s.replace('local open,input,busy=true,"",false;', 'local open,input,busy=true,"",false; local last_made={};',1)
          # fix accidental v0.5.2 line
          s=s.replace('local _,kn=reaper.GetSetMediaItemInfo_String and reaper.GetSetMediaItemTakeInfo_String(take,"P_NAME","",false) or false,"";', 'local _,kn=reaper.GetSetMediaItemTakeInfo_String(take,"P_NAME","",false);',1)
          # diagnosis Save dialog
          a=s.index('local function save_diagnosis()'); b=s.index('\nlocal function first_text_field',a)
          new='''local function save_diagnosis()\n local suggested="Composition-Studio-Diagnose-"..os.date("%Y%m%d-%H%M%S")..".json"\n local ok,fn=reaper.GetUserFileNameForWrite(suggested,"Diagnose speichern","json")\n if not ok or not fn or fn=="" then return end\n if not fn:lower():match("%.json$") then fn=fn..".json" end\n if write_file(fn,diag_json()) then update_status="Diagnose gespeichert: "..fn else update_status="Diagnose konnte nicht gespeichert werden." end\nend\nlocal function export_last_midi()\n if #last_made==0 then update_status="Noch keine von Composition Studio erzeugte Komposition zum Exportieren."; return end\n reaper.Main_OnCommand(40289,0) -- unselect all items\n for _,it in ipairs(last_made) do if it and reaper.ValidatePtr(it,"MediaItem*") then reaper.SetMediaItemSelected(it,true) end end\n reaper.UpdateArrange()\n -- REAPERs eigener MIDI-Exportdialog: Dateiname/Speicherort und Mehrspur-Optionen bleiben sichtbar.\n reaper.Main_OnCommand(40849,0)\nend'''
          s=s[:a]+new+s[b:]
          # New free musical phase: no CS/QN syntax whatsoever.
          a=s.index('local function composition_prompt(request,items,tracks,is_new)'); b=s.index('\nlocal job=nil',a)
          new='''local function composition_prompt(request,items,tracks,is_new)\n if is_new then\n  return [[Komponiere das verlangte Stück musikalisch frei und eigenständig. Konzentriere dich ausschließlich auf musikalische Gestalt, Verlauf, Stimmen, Rhythmus, Harmonik, Artikulation und Charakter. Denke noch NICHT an MIDI-Codierung, QN-Werte, CS-Zeilen oder ein technisches Ausgabeformat. Schreibe einen vollständigen, konkret ausnotierbaren musikalischen Entwurf, aus dem anschließend eine andere technische Instanz die MIDI-Daten erzeugen kann. Mache keine Erläuterung über deine Arbeitsweise.]].."\\n\\nAUFTRAG:\\n"..request\n end\n return [[Du komponierst Musik in Composition Studio. Nutze das konkret übergebene vorhandene Material als musikalischen Kontext und erfülle den freien Auftrag eigenständig; füge keine unnötigen Regeln hinzu. TIME_SELECTION ist nur bei ausdrücklichem Bezug auf den markierten Bereich ein Zielbereich. Eine ausgewählte TRACK_GUID kann auch ohne ausgewähltes MIDI-Item direkt Ziel sein. Jedes neu erzeugte MIDI-Item MUSS einen passenden General-MIDI-Program-Change (0-127) erhalten.\nAntworte ausschließlich:\nCS|unchanged|SOURCE_GUID\nCS|target|SOURCE_GUID|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nCS|track|TRACK_GUID|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nCS|revised|SOURCE_GUID|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nCS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...]].."\\nAUFTRAG:\\n"..request.."\\nMUSIK:\\n"..music_context(items,tracks,false)\nend\nlocal function midi_translation_prompt(request,draft)\n return [[Du bist jetzt ausschließlich Notations- und MIDI-Übersetzer. Übertrage den folgenden bereits fertigen musikalischen Entwurf so vollständig und werkgetreu wie möglich in Composition-Studios MIDI-Daten. Komponiere NICHT neu, vereinfache NICHT, regularisiere NICHT den Rhythmus und ersetze keine ungewöhnlichen musikalischen Entscheidungen durch Standards. Bewahre insbesondere rhythmische Vielfalt, Pausen, Stimmführung und Phrasierung des Entwurfs.\nErzeuge für jedes Instrument genau eine Zeile:\nCS|new|-|NAME|PROGRAM|startQN,durationQN,pitch,velocity,channel;...\nPROGRAM ist General MIDI 0-127. startQN und durationQN dürfen beliebige sinnvolle Dezimalwerte haben. Antworte ausschließlich mit CS-Zeilen.]].."\\n\\nURSPRÜNGLICHER AUFTRAG:\\n"..request.."\\n\\nFERTIGER MUSIKALISCHER ENTWURF:\\n"..draft\nend'''
          s=s[:a]+new+s[b:]
          # add draft diagnostic
          s=s.replace('"controller_answer","composition_prompt","composition_answer"', '"controller_answer","composition_prompt","musical_draft","translation_prompt","composition_answer"',1)
          # In controller NEED_NEW launch musical draft rather than technical composition
          old='local cp=composition_prompt(data.request,full,tracks,newwhy~=nil); diag_set("composition_prompt",cp); data.full=full; data.music_tracks=tracks; data.is_new=newwhy~=nil; launch("composition",cp,key,data); return end'
          new='local cp=composition_prompt(data.request,full,tracks,newwhy~=nil); diag_set("composition_prompt",cp); data.full=full; data.music_tracks=tracks; data.is_new=newwhy~=nil; launch(newwhy and "musical_draft" or "composition",cp,key,data); return end'
          if old not in s: raise SystemExit('controller composition anchor missing')
          s=s.replace(old,new,1)
          # insert musical_draft stage before composition
          old='elseif stage=="analysis" then add("KI",text); busy=false; return\n elseif stage=="composition" then'
          new='elseif stage=="analysis" then add("KI",text); busy=false; return\n elseif stage=="musical_draft" then\n  diag_set("musical_draft",text); data.draft=text; local tp=midi_translation_prompt(data.request,text); diag_set("translation_prompt",tp); launch("composition",tp,key,data); return\n elseif stage=="composition" then'
          if old not in s: raise SystemExit('stage anchor missing')
          s=s.replace(old,new,1)
          # remember generated items
          old='data.comp=text; data.made=made; launch("summary",summary_prompt(data.request,text,made),key,data); return'
          new='data.comp=text; data.made=made; last_made=made; launch("summary",summary_prompt(data.request,text,made),key,data); return'
          if old not in s: raise SystemExit('made anchor missing')
          s=s.replace(old,new,1)
          # better status names
          s=s.replace('job.stage=="composition" and "KI komponiert …" or job.stage=="summary" and "KI beschreibt das Stück …" or "KI arbeitet …"', 'job.stage=="musical_draft" and "KI komponiert …" or job.stage=="composition" and "MIDI wird erzeugt …" or job.stage=="summary" and "KI beschreibt das Stück …" or "KI arbeitet …"',1)
          # menu MIDI export next to diagnosis
          old='if reaper.ImGui_MenuItem(ctx,"Diagnose speichern") then save_diagnosis() end; if reaper.ImGui_MenuItem(ctx,"Update") then install_update() end;'
          new='if reaper.ImGui_MenuItem(ctx,"MIDI exportieren …") then export_last_midi() end; if reaper.ImGui_MenuItem(ctx,"Diagnose speichern …") then save_diagnosis() end; if reaper.ImGui_MenuItem(ctx,"Update") then install_update() end;'
          if old not in s: raise SystemExit('menu anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Lua syntax check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
      - name: Verify v0.5.4
        run: |
          grep -q -- '-- @version 0.5.4' 'Composition Studio.lua'
          grep -q 'local VERSION="0.5.4"' 'Composition Studio.lua'
          grep -q 'musical_draft' 'Composition Studio.lua'
          grep -q 'midi_translation_prompt' 'Composition Studio.lua'
          grep -q 'MIDI exportieren' 'Composition Studio.lua'
          grep -q 'GetUserFileNameForWrite' 'Composition Studio.lua'
      - name: Commit
        run: |
          git config user.name 'Composition Studio Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.4 two-stage composition and export dialogs'
          git push origin HEAD:composition-studio
