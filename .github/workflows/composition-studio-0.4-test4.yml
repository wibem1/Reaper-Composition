name: Composition Studio 0.4-test4 upgrade
on:
  push:
    branches: [composition-studio]
    paths: ['.github/workflows/composition-studio-0.4-test4.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Upgrade source structurally
        shell: python
        run: |
          from pathlib import Path
          p=Path('Composition Studio.lua')
          s=p.read_text()
          assert '-- @version 0.4-test3' in s and 'local VERSION="0.4-test3"' in s
          s=s.replace('-- @version 0.4-test3','-- @version 0.4-test4',1).replace('local VERSION="0.4-test3"','local VERSION="0.4-test4"',1)
          marker="Eine vollständige Neukomposition benötigt weder ein vorhandenes MIDI-Item noch eine ausgewählte Spur; ein klarer Auftrag wie 'Erstelle ein Stück für Violine und Gitarre' ist NEED_MUSIC."
          replacement="Eine vollständige Neukomposition benötigt weder ein vorhandenes MIDI-Item noch eine ausgewählte Spur. Vorhandene REAPER-Auswahl und TIME_SELECTION sind nur Kontext, solange der Benutzer nicht sprachlich auf vorhandenes Material, Auswahl, Spur, Item, markierten Bereich, Fortsetzung oder Bearbeitung Bezug nimmt. Ein klarer eigenständiger Auftrag wie 'Erstelle ein Stück für Violine und Gitarre' ist NEED_NEW."
          assert marker in s
          s=s.replace(marker,replacement,1)
          marker2='local why=answer:match("^NEED_MUSIC|(.*)$"); if why then local full=selected_items(true);'
          replacement2='local newwhy=answer:match("^NEED_NEW|(.*)$"); local why=answer:match("^NEED_MUSIC|(.*)$"); if newwhy or why then local full=newwhy and {} or selected_items(true); if newwhy then tracks={} end;'
          assert marker2 in s
          s=s.replace(marker2,replacement2,1)
          # Add NEED_NEW to the controller's allowed response list immediately before the existing instruction terminator.
          anchor='NEED_MUSIC|Begründung'
          pos=s.find(anchor)
          assert pos>=0
          endpos=pos+len(anchor)
          if 'NEED_NEW|Begründung' not in s[pos:pos+120]:
              s=s[:endpos]+'\\nNEED_NEW|Begründung'+s[endpos:]
          p.write_text(s)
          assert 'local VERSION="0.4-test4"' in s
          assert 'NEED_NEW|Begründung' in s
          assert 'local full=newwhy and {} or selected_items(true)' in s
          assert 'ist NEED_NEW' in s
      - name: Commit source
        run: |
          git config user.name "Composition Studio Builder"
          git config user.email "actions@users.noreply.github.com"
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio 0.4-test4 intent-aware fresh composition'
          git push origin composition-studio