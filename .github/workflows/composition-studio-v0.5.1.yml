name: Composition Studio v0.5.1 upgrade
on:
  push:
    branches: [composition-studio]
    paths: ['.github/workflows/composition-studio-v0.5.1.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
      - name: Build v0.5.1
        run: python .github/v051_builder.py
      - name: Lua syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
      - name: Verify v0.5.1
        run: |
          grep -q 'local VERSION="0.5.1"' 'Composition Studio.lua'
          grep -q 'claude-fable-5' 'Composition Studio.lua'
          grep -q 'gemini-3.8-flash' 'Composition Studio.lua'
          grep -q 'gpt-5.6-sol' 'Composition Studio.lua'
      - name: Commit v0.5.1
        run: |
          git config user.name "Composition Studio Builder"
          git config user.email "actions@users.noreply.github.com"
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.1 multi-provider model selection'
          git push origin composition-studio