name: Composition Studio v0.5.1 upgrade
on:
  push:
    branches: [composition-studio]
    paths: ['.github/workflows/composition-studio-v0.5.1.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: composition-studio
          fetch-depth: 2
      - name: Recover and run v0.5.1 builder
        shell: python
        run: |
          import subprocess
          old=subprocess.check_output(['git','show','HEAD^:.github/workflows/composition-studio-v0.5.1.yml'],text=True)
          lines=old.splitlines()
          start=next(i for i,x in enumerate(lines) if x.strip()=='- name: Build v0.5.1')
          run=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
          end=next(i for i in range(run+1,len(lines)) if lines[i].strip()=='- name: Lua syntax check')
          code='\n'.join(x[10:] if x.startswith('          ') else x for x in lines[run+1:end])
          exec(compile(code,'v051_builder.py','exec'))
      - name: Lua syntax check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p 'Composition Studio.lua'
      - name: Commit v0.5.1
        run: |
          git config user.name "Composition Studio Builder"
          git config user.email "actions@users.noreply.github.com"
          git add 'Composition Studio.lua'
          git commit -m 'Composition Studio v0.5.1 multi-provider UI'
          git push origin composition-studio